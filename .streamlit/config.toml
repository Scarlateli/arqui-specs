[client]
# Desabilita atalhos de teclado do Streamlit (ex: C = "Clear caches")
# que conflitam com Cmd+C normal do usuário
toolbarMode = "minimal"

[theme]
# Identidade Gabriela Lendecker — tema claro
primaryColor = "#7A2E2A"              # Bordo/terracota — botões, links, destaques
backgroundColor = "#FAF6EF"           # Cream claro — fundo principal
secondaryBackgroundColor = "#F0E8D8"  # Cream médio — sidebar, cards, inputs
textColor = "#2A1510"                 # Ink — texto principal
font = "sans serif"
