[client]
# Desabilita atalhos de teclado do Streamlit (ex: C = "Clear caches")
# que conflitam com Cmd+C normal do usuário
toolbarMode = "minimal"

[theme]
# Paleta baseada na estética da apresentação — Estudio GL
# Tons neutros quentes, tipicamente usados em marcas de arquitetura
# Confirme com a Gabriela se quer ajustar as cores
primaryColor = "#8B6F47"           # Bronze quente — destaques, botões
backgroundColor = "#FAFAF7"        # Branco quente — fundo principal
secondaryBackgroundColor = "#F0EDE6"  # Bege — sidebar, containers
textColor = "#1C1C1C"              # Quase preto — texto principal
font = "sans serif"
